name: Project CI

on:
  push:
    branches: [main, refactor]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      TEST_DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      API_BASE_URL: http://localhost:8000

      SECRET_KEY: test_secret_key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontendReact

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontendReact/package-lock.json

      - name: Install dependencies
        run: npm ci 

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [api-tests, frontend]

    env:
      E2E_BASE_URL: http://localhost:8080
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
        
      - name: Start application
        run: >-
          docker compose
          -p internal-ticket-system-e2e
          --env-file e2e/.env.e2e.example
          up -d --build
      
      - name: Wait for application
        run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/health

      - name: Run E2E tests
        run: >-
          pytest e2e -v
          --browser=chromium
          --tracing=retain-on-failure
          --video=retain-on-failure
          --alluredir=allure-results
          --clean-alluredir

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            allure-results
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Show Docker logs
        if: failure()
        run: >-
          docker compose
          -p internal-ticket-system-e2e
          --env-file e2e/.env.e2e.example
          logs --no-color

      - name: Stop application
        if: always()
        run: >-
          docker compose
          -p internal-ticket-system-e2e
          --env-file e2e/.env.e2e.example
          down -v
    
